name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t jackdaw:ci .

      # Import through the real entrypoint as a remapped user (Unraid's
      # nobody:users), so a package that is missing or unreadable after the
      # privilege drop fails CI instead of a release.
      - name: Smoke-test import as remapped user
        run: >
          docker run --rm -e PUID=99 -e PGID=100 jackdaw:ci
          /app/.venv/bin/python -c "import importlib.util as u, jackdaw; assert u.find_spec('jackdaw.serve')"
